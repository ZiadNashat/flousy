<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فلوسي">
<meta name="theme-color" content="#0b0d14">
<title>فلوسي</title>
<style>
:root{
  --bg:#0b0d14;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);
  --tx:#f1f3f8;--mut:#9aa3b5;--pri:#7c5cff;--pri2:#22d3ee;
  --ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic","SF Pro Text",Tahoma,sans-serif;font-size:15px;overscroll-behavior:none}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(110px + env(safe-area-inset-bottom));overflow-x:hidden}
/* خلفية متحركة */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:float 14s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:#7c5cff;top:-80px;right:-90px}
.b2{width:260px;height:260px;background:#22d3ee;top:40%;left:-120px;animation-delay:-5s;opacity:.25}
.b3{width:240px;height:240px;background:#ec4899;bottom:-60px;right:-60px;animation-delay:-9s;opacity:.22}
@keyframes float{to{transform:translate(40px,60px) scale(1.15)}}

header{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 18px}
.hi small{color:var(--mut);font-size:13px}
.hi h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx);font-size:19px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:18px;margin-bottom:14px;animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* الكارت الرئيسي */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#6d4dff 0%,#8b5cf6 45%,#0ea5e9 100%);border:0;padding:22px}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 0%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.hero .lbl{font-size:13px;opacity:.85}
.hero .amt{font-size:40px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .amt.neg{color:#ffe4e6}
.hero .hint{font-size:13px;opacity:.9}
.hero .ringwrap{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px;font-size:12px;margin-top:12px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{padding:15px;margin:0}
.stat .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;margin-bottom:10px}
.stat span{color:var(--mut);font-size:12.5px}
.stat b{display:block;font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}

h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h3 small{color:var(--mut);font-weight:500;font-size:12.5px}

/* توزيع */
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--card2);margin:4px 0 12px}
.dist i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut)}
.legend em{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:5px;vertical-align:middle}

/* عناصر */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0;padding-bottom:2px}
.item .em{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--mut);font-size:12.5px}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-bar{height:5px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #4b5368;display:grid;place-items:center;flex-shrink:0;transition:.25s;color:transparent;font-size:14px;background:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#06281c;transform:scale(1.05)}
.item.done .tx b{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:6px}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:13.5px;line-height:1.7}
.empty div{font-size:34px;margin-bottom:6px}

/* أهداف */
.goal{display:flex;gap:16px;align-items:center}
.goal svg{flex-shrink:0}
.goal .tx{flex:1}
.goal .tx b{font-size:16px}
.goal .tx small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.goal .acts{display:flex;gap:8px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:8px 13px;font-size:13px;font-weight:600}
.ringtxt{font-size:13px;font-weight:800;fill:var(--tx)}

/* tabs */
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px;height:66px;border-radius:24px;background:rgba(20,23,34,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:10}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;flex:1;transition:.2s}
nav button .i{font-size:20px;transition:.25s}
nav button.on{color:var(--tx)}
nav button.on .i{transform:translateY(-2px) scale(1.12)}
nav .fab{width:54px;height:54px;flex:0 0 54px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:28px;margin-top:-30px;box-shadow:0 10px 30px rgba(124,92,255,.55);justify-content:center}

/* bottom sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#151824;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1);z-index:21;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:#3a4052;margin:2px auto 14px}
.sheet h2{font-size:19px;margin-bottom:14px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.types button{background:var(--card);border:1.5px solid var(--line);color:var(--mut);border-radius:15px;padding:11px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.types button .i{font-size:20px}
.types button.on{border-color:var(--pri);color:var(--tx);background:rgba(124,92,255,.15)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 2px 6px}
.in{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--tx);border-radius:14px;padding:14px;font-size:16px;outline:none;transition:.2s;font-family:inherit}
.in:focus{border-color:var(--pri);background:rgba(124,92,255,.08)}
.seg{display:flex;background:var(--card);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:10px;border-radius:10px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--card2);color:var(--tx)}
.emojis{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.emojis button{flex-shrink:0;width:44px;height:44px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:20px}
.emojis button.on{border-color:var(--pri);background:rgba(124,92,255,.15)}
.primary{width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:16px;font-weight:700;box-shadow:0 10px 26px rgba(124,92,255,.4)}
.primary:active{transform:scale(.98)}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}
.preview{margin-top:12px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);color:#a7f3d0;padding:11px 13px;border-radius:13px;font-size:13px;display:none}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);background:#1f2433;border:1px solid var(--line);padding:12px 18px;border-radius:15px;font-size:14px;font-weight:600;transition:.4s cubic-bezier(.2,.9,.2,1);z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header>
  <div class="hi"><small id="greet"></small><h1 id="ttl">فلوسي</h1></div>
  <button class="iconbtn" type="button" id="setBtn" aria-label="الإعدادات">⚙️</button>
</header>

<!-- الرئيسية -->
<section class="tab on" id="t-home">
  <div class="glass hero">
    <div class="lbl">فاضلك تصرفه براحتك الشهر ده</div>
    <div class="amt" id="free">0</div>
    <div class="hint" id="perDay"></div>
    <div class="pill" id="paidPill">✅ 0 من 0 مدفوع</div>
    <div class="ringwrap" id="heroRing"></div>
  </div>

  <div class="stats">
    <div class="glass stat"><div class="ic" style="background:rgba(52,211,153,.15)">💵</div><span>الدخل</span><b class="ok" id="sIn">0</b></div>
    <div class="glass stat"><div class="ic" style="background:rgba(251,113,133,.15)">💳</div><span>الأقساط</span><b class="bad" id="sInst">0</b></div>
    <div class="glass stat"><div class="ic" style="background:rgba(251,191,36,.15)">🧾</div><span>الالتزامات</span><b class="warn" id="sOb">0</b></div>
    <div class="glass stat"><div class="ic" style="background:rgba(124,92,255,.18)">🎯</div><span>التحويش</span><b style="color:#a78bfa" id="sSave">0</b></div>
  </div>

  <div class="glass">
    <h3>دخلك رايح فين؟ <small id="pctUsed"></small></h3>
    <div class="dist" id="dist"></div>
    <div class="legend">
      <span><em style="background:#fb7185"></em>أقساط</span>
      <span><em style="background:#fbbf24"></em>التزامات</span>
      <span><em style="background:#a78bfa"></em>تحويش</span>
      <span><em style="background:#34d399"></em>حر</span>
    </div>
  </div>

  <div class="glass">
    <h3>مدفوعات الشهر <small>دوس ✓ لما تدفع</small></h3>
    <div id="checklist"></div>
  </div>
</section>

<!-- الدخل -->
<section class="tab" id="t-in">
  <div class="glass"><h3>مصادر الدخل <small id="inTotal"></small></h3><div id="l-income"></div></div>
</section>

<!-- المصاريف -->
<section class="tab" id="t-out">
  <div class="glass"><h3>الأقساط 💳 <small id="instTotal"></small></h3><div id="l-inst"></div></div>
  <div class="glass"><h3>الالتزامات الشهرية 🧾 <small id="obTotal"></small></h3><div id="l-ob"></div></div>
</section>

<!-- الأهداف -->
<section class="tab" id="t-goal">
  <div id="l-goal"></div>
</section>

<nav>
  <button type="button" data-t="home" class="on"><span class="i">🏠</span>الرئيسية</button>
  <button type="button" data-t="in"><span class="i">💵</span>الدخل</button>
  <button type="button" class="fab" id="fab" aria-label="إضافة">+</button>
  <button type="button" data-t="out"><span class="i">💳</span>المصاريف</button>
  <button type="button" data-t="goal"><span class="i">🎯</span>أهدافي</button>
</nav>

<div class="ov" id="ov"></div>

<!-- شيت الإضافة -->
<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <h2 id="addTitle">إضافة جديدة</h2>
  <div class="types" id="types">
    <button type="button" data-k="income" class="on"><span class="i">💵</span>دخل</button>
    <button type="button" data-k="inst"><span class="i">💳</span>قسط</button>
    <button type="button" data-k="ob"><span class="i">🧾</span>التزام</button>
    <button type="button" data-k="goal"><span class="i">🎯</span>هدف</button>
  </div>
  <form id="addForm">
    <label class="f">أيقونة</label>
    <div class="emojis" id="emojis"></div>
    <label class="f" id="nameLbl">الاسم</label>
    <input class="in" id="fName" maxlength="40">
    <label class="f" id="amtLbl">المبلغ</label>
    <input class="in" id="fAmt" type="number" inputmode="decimal" min="0" placeholder="0">
    <div id="extra"></div>
    <div class="preview" id="preview"></div>
    <div class="err" id="err" aria-live="polite"></div>
    <button class="primary" type="submit" id="saveBtn">حفظ</button>
  </form>
</div>

<!-- شيت الإعدادات -->
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h2>الإعدادات</h2>
  <label class="f">اسمك</label>
  <input class="in" id="uName" placeholder="اكتب اسمك">
  <label class="f">العملة</label>
  <input class="in" id="uCur" placeholder="ج.م">
  <label class="f">يوم القبض في الشهر</label>
  <input class="in" id="uPay" type="number" inputmode="numeric" min="1" max="31" placeholder="1">
  <div style="margin-top:14px">
    <div class="setrow"><span>📤 خد نسخة احتياطية</span><button class="chip" type="button" id="exp">تصدير</button></div>
    <div class="setrow"><span>📥 استرجع نسخة</span><button class="chip" type="button" id="imp">استيراد</button></div>
    <div class="setrow"><span class="bad">🗑️ امسح كل البيانات</span><button class="chip" type="button" id="wipe">مسح</button></div>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button class="primary" type="button" id="saveSet">حفظ</button>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
const K='flousy_pro_v1';
const $=id=>document.getElementById(id);
const ym=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)};
const def={income:[],inst:[],ob:[],goal:[],paid:{},month:ym(),user:'',cur:'ج.م',payDay:1};
let S;
try{S=Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S={...def}}
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const fmt=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('en-US')+' '+S.cur;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== بداية شهر جديد =====
if(S.month!==ym()){
  S.income=S.income.filter(x=>x.type==='m');
  S.inst.forEach(x=>{if(S.paid['inst'+x.id])x.left=Math.max(0,x.left-1)});
  const doneInst=S.inst.filter(x=>x.left===0).length;
  S.inst=S.inst.filter(x=>x.left>0);
  S.goal.forEach(g=>{if(S.paid['goal'+g.id])g.saved=Math.min(g.target,g.saved+g.monthly)});
  S.paid={};S.month=ym();save();
  if(doneInst)setTimeout(()=>toast('🎉 خلصت '+doneInst+' قسط!'),600);
}

// ===== toast =====
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

// ===== count-up =====
function count(el,to){
  const from=parseFloat(el.dataset.v||0);el.dataset.v=to;
  const st=performance.now(),d=700;
  const step=t=>{const p=Math.min(1,(t-st)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function ring(p,size,stroke,label,c1='#7c5cff',c2='#22d3ee',track='rgba(255,255,255,.12)'){
  p=Math.max(0,Math.min(100,p||0));
  const r=(size-stroke)/2,C=2*Math.PI*r,id='g'+Math.random().toString(36).slice(2,7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <defs><linearGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round"
   stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)" data-off="${C*(1-p/100)}"/>
  ${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ringtxt">${label}</text>`:''}</svg>`;
}
const animRings=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('circle[data-off]').forEach(c=>c.style.strokeDashoffset=c.dataset.off)));

const empty=(e,t)=>`<div class="empty"><div>${e}</div>${t}</div>`;

// ===== render =====
function render(){
  const sum=a=>a.reduce((s,x)=>s+x.amt,0);
  const active=S.goal.filter(g=>g.saved<g.target);
  const tin=sum(S.income),ti=sum(S.inst),to=sum(S.ob),ts=active.reduce((s,g)=>s+g.monthly,0);
  const free=tin-ti-to-ts;
  const h=new Date().getHours();
  $('greet').textContent=(h<12?'صباح الخير':'مساء الخير')+' 👋';
  $('ttl').textContent=S.user?S.user:'فلوسي';

  const fe=$('free');count(fe,free);fe.classList.toggle('neg',free<0);
  // باقي أيام لحد القبض
  const now=new Date();let next=new Date(now.getFullYear(),now.getMonth(),S.payDay);
  if(next<=now)next=new Date(now.getFullYear(),now.getMonth()+1,S.payDay);
  const days=Math.max(1,Math.ceil((next-now)/864e5));
  $('perDay').textContent=free<0?'⚠️ مصاريفك أكبر من دخلك — راجع التزاماتك':(tin?`يعني حوالي ${fmt(free/days)} في اليوم لمدة ${days} يوم`:'ابدأ بإضافة دخلك من زرار +');
  count($('sIn'),tin);count($('sInst'),ti);count($('sOb'),to);count($('sSave'),ts);

  // checklist
  const rows=[...S.inst.map(x=>({k:'inst',x,sub:'قسط · باقي '+x.left})),...S.ob.map(x=>({k:'ob',x,sub:'التزام شهري'})),...active.map(x=>({k:'goal',x:{...x,amt:x.monthly},sub:'تحويش'}))];
  const paidN=rows.filter(r=>S.paid[r.k+r.x.id]).length;
  $('paidPill').textContent=`✅ ${paidN} من ${rows.length} مدفوع`;
  $('heroRing').innerHTML=rows.length?ring(paidN/rows.length*100,74,8,Math.round(paidN/rows.length*100)+'%','#fff','#fff','rgba(255,255,255,.22)').replace('class="ringtxt"','class="ringtxt" style="fill:#fff"'):'';
  $('checklist').innerHTML=rows.length?rows.map(r=>{const on=S.paid[r.k+r.x.id];
    return `<div class="item ${on?'done':''}"><button type="button" class="check ${on?'on':''}" data-pay="${r.k+r.x.id}" aria-label="تم الدفع">✓</button>
    <div class="em">${r.x.emoji||'•'}</div><div class="tx"><b>${esc(r.x.name)}</b><small>${r.sub}</small></div><div class="val">${fmt(r.x.amt)}</div></div>`}).join('')
    :empty('📝','لسه مفيش مدفوعات — ضيف أقساطك والتزاماتك');

  // توزيع
  const base=Math.max(tin,ti+to+ts,1);
  const seg=[[ti,'#fb7185'],[to,'#fbbf24'],[ts,'#a78bfa'],[Math.max(free,0),'#34d399']];
  $('dist').innerHTML=seg.map(([v,c])=>`<i style="width:0;background:${c}" data-w="${v/base*100}"></i>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#dist i').forEach(i=>i.style.width=i.dataset.w+'%')));
  $('pctUsed').textContent=tin?Math.round((ti+to+ts)/tin*100)+'% محجوز':'';

  // الدخل
  $('inTotal').textContent=fmt(tin);
  $('l-income').innerHTML=S.income.length?S.income.map(x=>`<div class="item"><div class="em">${x.emoji}</div><div class="tx"><b>${esc(x.name)}</b><small>${x.type==='m'?'🔁 ثابت كل شهر':'⚡ مرة واحدة'}</small></div><div class="val ok">+${fmt(x.amt)}</div><button type="button" class="x" data-del="income:${x.id}">✕</button></div>`).join('')
    :empty('💵','ضيف مرتبك وأي دخل تاني من زرار +');

  // الأقساط
  $('instTotal').textContent=fmt(ti);
  $('l-inst').innerHTML=S.inst.length?S.inst.map(x=>{const p=(x.total-x.left)/x.total*100;
    return `<div class="item"><div class="em">${x.emoji}</div><div class="tx"><b>${esc(x.name)}</b><small>باقي ${x.left} من ${x.total} · متبقي ${fmt(x.amt*x.left)}</small><div class="mini-bar"><i style="width:${p}%"></i></div></div><div class="val bad">${fmt(x.amt)}</div><button type="button" class="x" data-del="inst:${x.id}">✕</button></div>`}).join('')
    :empty('💳','مفيش أقساط 🙌');

  $('obTotal').textContent=fmt(to);
  $('l-ob').innerHTML=S.ob.length?S.ob.map(x=>`<div class="item"><div class="em">${x.emoji}</div><div class="tx"><b>${esc(x.name)}</b><small>كل شهر</small></div><div class="val warn">${fmt(x.amt)}</div><button type="button" class="x" data-del="ob:${x.id}">✕</button></div>`).join('')
    :empty('🧾','ضيف الإيجار، النت، البيت...');

  // الأهداف
  $('l-goal').innerHTML=S.goal.length?S.goal.map((g,i)=>{const p=g.saved/g.target*100,done=p>=100,m=Math.ceil((g.target-g.saved)/g.monthly);
    const d=new Date();d.setMonth(d.getMonth()+m);
    return `<div class="glass" style="animation-delay:${i*.06}s"><div class="goal">${ring(p,86,9,Math.floor(p)+'%')}
    <div class="tx"><b>${g.emoji} ${esc(g.name)}</b><small>${fmt(g.saved)} من ${fmt(g.target)}</small>
    <small>${done?'🎉 خلصت! روح اشتريه':`📅 هتوصل تقريبًا ${d.toLocaleDateString('ar-EG',{month:'long',year:'numeric'})} (${m} شهر)`}</small>
    <div class="acts">${done?'':`<button type="button" class="chip" data-addg="${g.id}">+ ضيف مبلغ</button>`}<button type="button" class="chip" data-del="goal:${g.id}">مسح</button></div></div></div></div>`}).join('')
    :`<div class="glass">${empty('🎯','عاوز تشتري حاجة؟ اعمل هدف وحوّش له كل شهر')}</div>`;
  animRings();
}

// ===== tabs =====
document.querySelectorAll('nav button[data-t]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button[data-t],.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');const t=$('t-'+b.dataset.t);t.classList.add('on');
  t.querySelectorAll('.glass').forEach(g=>{g.style.animation='none';g.offsetHeight;g.style.animation=''});
  window.scrollTo({top:0,behavior:'smooth'});animRings();
}));

// ===== sheets =====
const ov=$('ov');let openSheet=null;
function open(s){openSheet=$(s);ov.classList.add('on');openSheet.classList.add('on')}
function close(){ov.classList.remove('on');openSheet&&openSheet.classList.remove('on');document.activeElement.blur()}
ov.addEventListener('click',close);

// ===== add form =====
const CFG={
  income:{t:'دخل جديد',n:'اسم الدخل',np:'مثلاً: المرتب',a:'المبلغ',em:['💵','💼','💻','🏦','🎁','📈','🤝']},
  inst:{t:'قسط جديد',n:'اسم القسط',np:'مثلاً: قسط الموبايل',a:'القسط الشهري',em:['💳','📱','🚗','🏠','💻','📺','🛋️']},
  ob:{t:'التزام شهري',n:'اسم الالتزام',np:'مثلاً: الإيجار',a:'المبلغ الشهري',em:['🏠','🌐','⚡','⛽','👨‍👩‍👦','🛒','📞','💊']},
  goal:{t:'هدف تحويش',n:'عاوز تشتري إيه؟',np:'مثلاً: لابتوب جديد',a:'السعر / المبلغ المطلوب',em:['🎯','💻','📱','✈️','🚗','💍','🎮','⌚']}
};
let kind='income',emo='💵',incType='m';
function setKind(k){
  kind=k;const c=CFG[k];emo=c.em[0];
  document.querySelectorAll('#types button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('addTitle').textContent=c.t;$('nameLbl').textContent=c.n;$('fName').placeholder=c.np;$('amtLbl').textContent=c.a;
  $('emojis').innerHTML=c.em.map(e=>`<button type="button" class="${e===emo?'on':''}" data-e="${e}">${e}</button>`).join('');
  let x='';
  if(k==='income')x=`<label class="f">النوع</label><div class="seg" id="seg"><button type="button" data-v="m" class="on">🔁 كل شهر</button><button type="button" data-v="o">⚡ مرة واحدة</button></div>`;
  if(k==='inst')x=`<label class="f">عدد الأقساط الباقية</label><input class="in" id="fLeft" type="number" inputmode="numeric" min="1" placeholder="مثلاً: 12">`;
  if(k==='goal')x=`<label class="f">هتحوش كام كل شهر؟</label><input class="in" id="fMon" type="number" inputmode="decimal" min="0" placeholder="0">
    <label class="f">معاك كام دلوقتي؟ (اختياري)</label><input class="in" id="fHave" type="number" inputmode="decimal" min="0" placeholder="0">`;
  $('extra').innerHTML=x;incType='m';$('err').textContent='';updPrev();
}
$('types').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setKind(b.dataset.k)});
$('emojis').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;emo=b.dataset.e;document.querySelectorAll('#emojis button').forEach(x=>x.classList.toggle('on',x===b))});
$('extra').addEventListener('click',e=>{const b=e.target.closest('#seg button');if(!b)return;incType=b.dataset.v;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b))});
const v=id=>{const el=$(id);const n=el?parseFloat(el.value):NaN;return isFinite(n)&&n>0?Math.min(n,1e10):0};
function updPrev(){
  const p=$('preview');let t='';
  if(kind==='goal'){const a=v('fAmt'),m=v('fMon'),h=v('fHave');if(a&&m){const n=Math.max(0,Math.ceil((a-h)/m));t=`👌 لو حوّشت ${fmt(m)} كل شهر هتوصل لهدفك في ${n} شهر`}}
  if(kind==='inst'){const a=v('fAmt'),l=Math.floor(v('fLeft'));if(a&&l)t=`💡 إجمالي المتبقي: ${fmt(a*l)}`}
  p.style.display=t?'block':'none';p.textContent=t;
}
$('addForm').addEventListener('input',updPrev);
$('fab').addEventListener('click',()=>{$('addForm').reset();setKind(kind);open('addSheet')});
$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id=Date.now(),name=$('fName').value.trim()||CFG[kind].np.replace('مثلاً: ',''),amt=v('fAmt');
  if(!amt)return $('err').textContent='اكتب مبلغ صحيح أكبر من صفر';
  if(kind==='income')S.income.push({id,name,amt,type:incType,emoji:emo});
  if(kind==='inst'){const l=Math.floor(v('fLeft'));if(!l)return $('err').textContent='اكتب عدد الأقساط الباقية';S.inst.push({id,name,amt,left:l,total:l,emoji:emo})}
  if(kind==='ob')S.ob.push({id,name,amt,emoji:emo});
  if(kind==='goal'){const m=v('fMon');if(!m)return $('err').textContent='اكتب هتحوش كام كل شهر';S.goal.push({id,name,target:amt,monthly:m,saved:Math.min(amt,v('fHave')),emoji:emo})}
  save();render();close();toast('✅ اتضاف');
});

// ===== actions =====
document.body.addEventListener('click',e=>{
  const p=e.target.closest('[data-pay]');if(p){S.paid[p.dataset.pay]=!S.paid[p.dataset.pay];save();render();if(S.paid[p.dataset.pay])toast('👏 تمام، اتدفع');return}
  const d=e.target.closest('[data-del]');if(d){if(!confirm('متأكد إنك عاوز تمسحه؟'))return;const[k,id]=d.dataset.del.split(':');S[k]=S[k].filter(x=>x.id!=id);save();render();toast('🗑️ اتمسح');return}
  const g=e.target.closest('[data-addg]');if(g){const n=parseFloat(prompt('ضيف كام للهدف؟'));if(!isFinite(n)||n<=0)return;const o=S.goal.find(x=>x.id==g.dataset.addg);o.saved=Math.min(o.target,o.saved+n);save();render();toast(o.saved>=o.target?'🎉 مبروك! وصلت لهدفك':'💪 برافو، قربت');}
});

// ===== settings =====
$('setBtn').addEventListener('click',()=>{$('uName').value=S.user;$('uCur').value=S.cur;$('uPay').value=S.payDay;open('setSheet')});
$('saveSet').addEventListener('click',()=>{S.user=$('uName').value.trim().slice(0,30);S.cur=$('uCur').value.trim().slice(0,6)||'ج.م';
  const d=parseInt($('uPay').value);S.payDay=d>=1&&d<=31?d:1;save();render();close();toast('✅ اتحفظ')});
$('exp').addEventListener('click',()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='flousy-backup-'+ym()+'.json';a.click();toast('📤 النسخة اتنزلت')});
$('imp').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.income))throw 0;S=Object.assign({},def,d);save();render();close();toast('📥 اترجعت')}catch(x){toast('❌ الملف مش صحيح')}};r.readAsText(f)});
$('wipe').addEventListener('click',()=>{if(confirm('هيتمسح كل حاجة. متأكد؟')){S={...def};save();render();close();toast('اتمسح كل حاجة')}});

setKind('income');render();
})();
</script>
</body>
</html>
